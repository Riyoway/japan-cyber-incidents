name: One-time confirmed breach audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/one-time-confirmed-breach-audit.mjs"
      - ".github/workflows/one-time-confirmed-breach-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run one-time breach audit
        run: node scripts/one-time-confirmed-breach-audit.mjs
      - name: Validate canonical dataset
        run: npm run validate
      - name: Commit canonical data changes
        run: |
          if git diff --quiet -- data/incidents.json; then
            echo "No canonical data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          git commit -m "data: complete one-time confirmed breach audit"
          git push

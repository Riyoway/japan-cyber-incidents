name: Validate dataset

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "schema/**"
      - "package.json"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "schema/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate dataset
        run: npm run validate

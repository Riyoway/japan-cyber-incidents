name: Apply one-time threat actor backfill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-audit-missing-actors.yml"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply supported threat actor attributions
        shell: python
        run: |
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path("data/incidents.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          reviewed_at = "2026-10-10"
          now = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          tracker = "https://api.ransomware.live/v2/countryvictims/JP"

          mappings = {
              "2026-06-30-musashino-university": {
                  "name": "Qilin",
                  "basis": "Qilin listed Musashino University on its data-leak site; the victim name and university domain match the incident. This is recorded as an attacker claim, not independent technical attribution.",
                  "sources": [tracker, "https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/"],
              },
              "2026-06-30-higuchi-shokai": {
                  "name": "Stormous",
                  "basis": "Stormous listed higuchi-inc.co.jp on its leak site; the domain corresponds to Higuchi Shokai. This is an attacker claim, not independent technical attribution.",
                  "sources": [tracker, "https://cyberthreatintelligence.net/ransomware-victim/higuchi-inc-co-jp-stormous-2026"],
              },
              "2026-04-14-shin-fa-com": {
                  "name": "cmdorganization",
                  "basis": "cmdorganization listed New FACOM Co., Ltd. / s-facom.jp as a victim. The company and domain match Shin FA-COM. This is an attacker claim, not independent technical attribution.",
                  "sources": [tracker, "https://www.dexpose.io/cmdorganization-targets-japanese-tech-firm-new-facom-co-ltd/"],
              },
              "2026-05-12-oriental-diamond": {
                  "name": "The Gentlemen",
                  "basis": "The Gentlemen listed Oriental Diamond / orientaldiamond.jp as a victim. This is an attacker claim, not independent technical attribution.",
                  "sources": [tracker, "https://www.dexpose.io/the-gentlemen-ransomware-attack-on-oriental-diamond-inc/"],
              },
              "2026-05-08-nostram": {
                  "name": "The Gentlemen",
                  "basis": "The Gentlemen listed Nostrum / nostrum.co.jp as a victim. The company/domain match the incident. This is an attacker claim, not independent technical attribution.",
                  "sources": [tracker, "https://www.dexpose.io/the-gentlemen-target-japans-nostrum-corporation-in-ransomware-attack/"],
              },
              "2026-03-17-medica-publishing": {
                  "name": "The Gentlemen",
                  "basis": "The Gentlemen listed MEDICUS SHUPPAN / medica.co.jp as a victim. The name and domain match Medica Publishing. This is an attacker claim, not independent technical attribution.",
                  "sources": [tracker, "https://www.dexpose.io/the-gentlemen-launch-ransomware-attack-on-medicus-shuppan/"],
              },
              "2026-01-23-makimura-ransomware": {
                  "name": "NightSpire",
                  "basis": "NightSpire listed Makimura Co., Ltd. / makimura.co.jp as a victim. This is an attacker claim, not independent technical attribution.",
                  "sources": [tracker, "https://www.dexpose.io/nightspire-targets-makimura-co-ltd-in-ransomware-attack/"],
              },
              "2026-01-18-sincere-ransomware": {
                  "name": "The Gentlemen",
                  "basis": "The Gentlemen listed Sincere Corporation / sincerehq.com as a victim. This is an attacker claim, not independent technical attribution.",
                  "sources": [tracker, "https://www.dexpose.io/thegentlemen-ransomware-attack-on-sincere-corporation/"],
              },
              "2026-04-28-marutake": {
                  "name": "The Gentlemen",
                  "basis": "The Gentlemen claimed Marutake Co., Ltd. / kk-marutake.co.jp; the official Marutake site confirms this is the same company affected by the April 2026 ransomware incident. This is an attacker claim, not independent technical attribution.",
                  "sources": [tracker, "https://www.dexpose.io/the-gentlemen-ransomware-attack-on-marutake-co-ltd/", "https://www.kk-marutake.co.jp/2026/05/08/6669"],
              },
              "2026-05-14-nihon-shisan-soken": {
                  "name": "SafePay",
                  "basis": "Public ransomware tracking attributes the May 2026 Aoyama Zaisan Networks / Japan Asset Research Institute incident to a SafePay leak-site claim; the victim later confirmed that stolen customer data appeared on the attacker's leak site. This remains an attacker-claim attribution.",
                  "sources": ["https://ransomnews.com/ransomware-attacks/2026-05/", "https://www.nssg.co.jp/news/2026/0911-1600.html"],
              },
          }

          changed = 0
          named = 0
          reviewed_unknown = 0

          for record in data.get("incidents", []):
              incident = record.get("incident", {})
              rid = record.get("id")

              if rid in mappings:
                  m = mappings[rid]
                  incident["threat_actor"] = m["name"]
                  incident["threat_actor_attribution"] = {
                      "name": m["name"],
                      "actor_type": "ransomware_group",
                      "aliases": [],
                      "status": "attacker_claim",
                      "confidence": "high",
                      "basis": m["basis"],
                      "sources": m["sources"],
                      "reviewed_at": reviewed_at,
                  }
                  record["last_updated"] = now
                  changed += 1
                  named += 1
                  continue

              # Complete the one-time ransomware backlog review without inventing an actor.
              # Existing named/structured attributions are preserved.
              if incident.get("ransomware") is True and not incident.get("threat_actor") and incident.get("threat_actor_attribution") is None:
                  incident["threat_actor_attribution"] = {
                      "name": None,
                      "actor_type": "unknown",
                      "aliases": [],
                      "status": "unknown",
                      "confidence": "unknown",
                      "basis": "Reviewed against the incident's existing public sources and a 2026 Japan ransomware leak-site tracker snapshot; no sufficiently supported named actor/group was identified. No actor has been inferred from the ransomware label alone.",
                      "sources": [],
                      "reviewed_at": reviewed_at,
                  }
                  record["last_updated"] = now
                  changed += 1
                  reviewed_unknown += 1

          missing_mapping_ids = sorted(set(mappings) - {r.get("id") for r in data.get("incidents", [])})
          if missing_mapping_ids:
              raise SystemExit(f"Mapping IDs not found: {missing_mapping_ids}")

          if changed:
              data["generated_at"] = now
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print(f"Changed {changed} records: {named} named attributions, {reviewed_unknown} reviewed unknowns")
          print(f"generated_at={data.get('generated_at')}")

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm run validate

      - name: Remove temporary audit artifacts
        run: |
          rm -f \
            tmp-missing-actors.json \
            tmp-missing-ransomware-actors.json \
            tmp-ransomware-live-jp.json \
            tmp-ransomware-live-jp-2026.json \
            tmp-actor-candidates.json \
            tmp-exact-actor-matches.json \
            .github/workflows/tmp-audit-missing-actors.yml

      - name: Commit canonical backfill and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: backfill ransomware threat actor attribution"
          git push

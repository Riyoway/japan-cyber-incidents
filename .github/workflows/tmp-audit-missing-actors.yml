name: Audit missing threat actors

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-audit-missing-actors.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find exact claim matches
        shell: python
        run: |
          import json, re
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path("data/incidents.json").read_text(encoding="utf-8"))
          claims = json.loads(Path("tmp-ransomware-live-jp-2026.json").read_text(encoding="utf-8"))
          corp = ["株式会社","有限会社","合同会社","一般社団法人","一般財団法人","学校法人","国立大学法人","国立研究開発法人","co.,ltd.","co., ltd.","co., ltd","co ltd","co ltd.","corporation","company limited","limited","inc.","inc","ltd.","ltd"]

          def norm(s):
              if not s: return ""
              s = str(s).lower()
              for x in corp: s = s.replace(x, "")
              return re.sub(r"[\W_]+", "", s, flags=re.UNICODE)

          def dom(s):
              if not s: return ""
              s = str(s).strip()
              if not s.startswith(("http://","https://")): s = "https://" + s
              try:
                  d = urlparse(s).netloc.lower().split(":")[0]
                  return d[4:] if d.startswith("www.") else d
              except Exception: return ""

          rows=[]
          for r in data.get("incidents", []):
              inc=r.get("incident",{})
              attr=inc.get("threat_actor_attribution") or {}
              if inc.get("threat_actor") or attr.get("name"): continue
              org=r.get("organization",{})
              names=[norm(org.get("name")),norm(org.get("name_en"))]
              names=[x for x in names if x]
              od=dom(org.get("website"))
              matches=[]
              for c in claims:
                  cn=norm(c.get("victim")); cd=dom(c.get("website"))
                  exact_domain=bool(od and cd and od==cd)
                  exact_name=bool(cn and cn in names)
                  name_contains=bool(cn and any(len(n)>=5 and len(cn)>=5 and (n in cn or cn in n) for n in names))
                  if exact_domain or exact_name or name_contains:
                      matches.append({**c,"exact_domain":exact_domain,"exact_name":exact_name,"name_contains":name_contains})
              if matches:
                  rows.append({"id":r.get("id"),"organization":org.get("name"),"organization_en":org.get("name_en"),"website":org.get("website"),"ransomware":inc.get("ransomware"),"matches":matches})
          Path("tmp-exact-actor-matches.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-exact-actor-matches.json
          git commit -m "chore: add exact actor match report"
          git push

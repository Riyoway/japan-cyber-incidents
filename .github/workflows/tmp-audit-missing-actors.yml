name: Audit missing threat actors

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-audit-missing-actors.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact 2026 Japan ransomware.live claims
        shell: python
        run: |
          import json
          from pathlib import Path

          victims = json.loads(Path("tmp-ransomware-live-jp.json").read_text(encoding="utf-8"))
          rows = []
          for v in victims:
              if not isinstance(v, dict): continue
              date = v.get("published") or v.get("discovered") or ""
              if not str(date).startswith("2026-"): continue
              rows.append({
                  "victim": v.get("post_title") or v.get("victim") or v.get("name"),
                  "group": v.get("group_name") or v.get("group") or v.get("gang"),
                  "website": v.get("website") or v.get("domain"),
                  "published": v.get("published"),
                  "discovered": v.get("discovered"),
                  "post_url": v.get("post_url") or v.get("permalink") or v.get("url"),
              })
          rows.sort(key=lambda x: str(x.get("published") or x.get("discovered") or ""), reverse=True)
          Path("tmp-ransomware-live-jp-2026.json").write_text(json.dumps(rows, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-ransomware-live-jp-2026.json
          git commit -m "chore: add compact 2026 Japan ransomware claims"
          git push

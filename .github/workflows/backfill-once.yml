name: Backfill dataset once

on:
  push:
    branches: [main]
    paths:
      - ".backfill/READY"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore researched dataset
        shell: bash
        run: |
          cat .backfill/part1.b64 .backfill/part2.b64 .backfill/part3.b64 .backfill/part4.b64 | base64 --decode > data/incidents.json
          npm run validate

      - name: Commit backfill
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          if git diff --cached --quiet; then
            echo "No dataset changes."
            exit 0
          fi
          git commit -m "data: backfill incident metadata"
          git pull --rebase origin main
          git push

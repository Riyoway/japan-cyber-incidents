name: Threat actor attribution backfill

on:
  push:
    branches: [main]
    paths:
      - "scripts/backfill-threat-actors.mjs"
      - ".github/workflows/backfill-threat-actors.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/backfill-threat-actors.mjs
      - run: npm run validate
      - name: Commit canonical data changes
        run: |
          if git diff --quiet -- data/incidents.json schema/incident.schema.json; then
            echo "No canonical data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json schema/incident.schema.json
          git commit -m "data: add threat actor attribution metadata"
          git push

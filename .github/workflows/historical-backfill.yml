name: Historical 2026 backfill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-backfill.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-2026-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Merge researched 2026 incidents
        run: node scripts/historical-backfill.mjs

      - name: Validate canonical dataset
        run: npm run validate

      - name: Commit canonical dataset
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/incidents.json)" ]; then
            echo "No canonical data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          git commit -m "data: backfill 2026 cyber incidents [skip ci]"
          git pull --rebase origin main
          git push

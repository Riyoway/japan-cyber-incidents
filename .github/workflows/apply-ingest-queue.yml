name: Apply ingest queue

on:
  push:
    branches: [main]
    paths:
      - "data/queue/**"
      - "scripts/apply-ingest-queue.mjs"
      - ".github/workflows/apply-ingest-queue.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: incident-ingest
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply queued operations
        run: node scripts/apply-ingest-queue.mjs

      - name: Validate canonical dataset
        run: npm run validate

      - name: Commit canonical data update
        run: |
          if git diff --quiet -- data/incidents.json data/queue; then
            echo "No queued data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/incidents.json data/queue
          git commit -m "data: apply incident ingest queue"
          git push
